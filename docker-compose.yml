# Local database for development: `docker compose up -d`
# Uses port 54329 on 127.0.0.1 so it never clashes with another Postgres (5432, 5433, Postgres.app…).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawsome
      POSTGRES_PASSWORD: pawsome
      POSTGRES_DB: pawsome
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pawsome-db:/var/lib/postgresql/data
volumes:
  pawsome-db:
